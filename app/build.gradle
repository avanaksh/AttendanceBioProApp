apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withReader('UTF-8') { r -> versionProps.load(r) }
}

def amazonCode = (project.findProperty('amazonVersionCode') ?: versionProps.getProperty('amazonVersionCode', '2')).toInteger()
def amazonName = (project.findProperty('amazonVersionName') ?: versionProps.getProperty('amazonVersionName', '1.1')).toString()

def androidCode = (project.findProperty('androidVersionCode') ?: versionProps.getProperty('androidVersionCode', '1')).toInteger()
def androidName = (project.findProperty('androidVersionName') ?: versionProps.getProperty('androidVersionName', '1.0')).toString()

android {
    namespace 'com.lrms.attendanceapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.lrms.attendanceapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    flavorDimensions "platform"
    productFlavors {
        standardAndroid {
            dimension "platform"
            applicationId "com.lrms.attendanceapp"
            versionCode androidCode
            versionName androidName
            buildConfigField "String", "REVENUECAT_API_KEY", "\"goog_imIbmlRuTysfzLQkdfZwAIOrvoJ\""
            buildConfigField "String", "STORE_NAME", "\"Google Play\""
        }
        amazon {
            dimension "platform"
            applicationId "com.lrms.attendanceapp"
            versionCode amazonCode
            versionName amazonName
            buildConfigField "String", "REVENUECAT_API_KEY", "\"amzn_gBlQlarricNvAfzyHewgmbWKDye\""
            buildConfigField "String", "STORE_NAME", "\"Amazon Appstore\""
        }
    }

    signingConfigs {
        release {
            def localProps = new Properties()
            def localFile = rootProject.file('local.properties')
            if (localFile.exists()) {
                localFile.withReader('UTF-8') { r -> localProps.load(r) }
            }
            def storePath = localProps.getProperty('RELEASE_STORE_FILE') ?: "F:/attendanceapprc/rcaap"
            storeFile file(storePath)
            storePassword localProps.getProperty('RELEASE_STORE_PASSWORD') ?: ""
            keyAlias localProps.getProperty('RELEASE_KEY_ALIAS') ?: ""
            keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD') ?: localProps.getProperty('RELEASE_STORE_PASSWORD') ?: ""
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Room SQLite Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Networking & Cloud DB Sync
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // CameraX for Biometric Scanning
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Location & GPS Services (Google Play flavor only)
    standardAndroidImplementation 'com.google.android.gms:play-services-location:21.1.0'

    // In-App Purchases & Subscriptions (RevenueCat SDK)
    implementation 'com.revenuecat.purchases:purchases:10.22.1'
    amazonImplementation 'com.revenuecat.purchases:purchases-store-amazon:10.22.1'
}

tasks.register('bumpAmazonVersion') {
    description = "Increments amazonVersionCode in version.properties"
    doLast {
        def propsFile = rootProject.file('version.properties')
        def props = new Properties()
        if (propsFile.exists()) {
            propsFile.withReader('UTF-8') { r -> props.load(r) }
        }
        int code = (props.getProperty('amazonVersionCode', '2')).toInteger() + 1
        props.setProperty('amazonVersionCode', code.toString())
        propsFile.withWriter('UTF-8') { w -> props.store(w, null) }
        println "SUCCESS: Amazon VersionCode bumped to: ${code}"
    }
}

tasks.register('bumpAndroidVersion') {
    description = "Increments androidVersionCode in version.properties"
    doLast {
        def propsFile = rootProject.file('version.properties')
        def props = new Properties()
        if (propsFile.exists()) {
            propsFile.withReader('UTF-8') { r -> props.load(r) }
        }
        int code = (props.getProperty('androidVersionCode', '1')).toInteger() + 1
        props.setProperty('androidVersionCode', code.toString())
        propsFile.withWriter('UTF-8') { w -> props.store(w, null) }
        println "SUCCESS: Android VersionCode bumped to: ${code}"
    }
}
